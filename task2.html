<!DOCTYPE html>
<html>
<head>
    <title>User Personal Information Form</title>
    <style>
        body{
            background-color:#f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container{
            width:400px;
            margin:20px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 5px gray;
        }

        fieldset{
            padding:15px;
        }

        legend{
            font-size:24px;
            font-weight:bold;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
            font-size:18px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:4px;
            box-sizing:border-box;
        }

        .gender{
            margin-top:10px;
        }

        .gender input{
            margin-left:10px;
        }

        textarea{
            resize:none;
        }

        button{
            margin-top:20px;
            padding:10px 20px;
            font-size:18px;
            border:2px solid black;
            background:white;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#e6e6e6;
        }
    </style>
</head>
<body>

<div class="container">

<form>

<fieldset>
    <legend>User personal information</legend>

    <label for="name">Enter your full name</label>
    <input type="text" id="name" value="Rahul Kumar">

    <label for="email">Enter your email</label>
    <input type="email" id="email" value="geeks@12345gmail.com">

    <label for="password">Enter your password</label>
    <input type="password" id="password">

    <label for="cpassword">Confirm your password</label>
    <input type="password" id="cpassword">

    <label>Enter your gender</label>

    <div class="gender">
        <input type="radio" id="male" name="gender" checked>
        <label for="male" style="display:inline;">Male</label>

        <input type="radio" id="female" name="gender">
        <label for="female" style="display:inline;">Female</label>

        <input type="radio" id="others" name="gender">
        <label for="others" style="display:inline;">Others</label>
    </div>

    <label for="dob">Enter your Date of Birth</label>
    <input type="date" id="dob">

    <label for="address">Enter your Address:</label>
    <textarea id="address" rows="3">Noida Sector 137</textarea>

    <button type="submit">submit</button>

</fieldset>

</form>

</div>

</body>
</html>
